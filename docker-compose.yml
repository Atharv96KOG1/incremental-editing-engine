version: "3.9"

services:
  chatbot:
    image: python:3.11-slim
    container_name: sample_chatbot
    working_dir: /app
    command: sh -c "pip install --no-cache-dir flask && python backend/chatbot.py"
    environment:
      PORT: "5000"
    volumes:
      - ./sample_project:/app
    ports:
      - "5000:5000"
    restart: unless-stopped

  minio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sample_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped

volumes:
  minio_data:
